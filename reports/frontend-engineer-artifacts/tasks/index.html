<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To-do list</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --text: #111827;
        --muted: #4b5563;
        --border: #d1d5db;
        --focus: #1d4ed8;
        --danger: #b91c1c;
        --surface: #f9fafb;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.4;
      }

      .container {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      header {
        margin-bottom: 18px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 6px;
      }

      .subhead { color: var(--muted); margin: 0; }

      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        padding: 16px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }

      input[type="text"] {
        width: min(520px, 100%);
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font: inherit;
        background: #fff;
        color: var(--text);
      }

      button {
        font: inherit;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
      }

      button.primary {
        border-color: #1d4ed8;
        background: #1d4ed8;
        color: #fff;
      }

      button.danger {
        border-color: var(--danger);
        color: var(--danger);
        background: #fff;
      }

      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .help {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .error {
        margin-top: 8px;
        color: var(--danger);
        font-size: 0.95rem;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
      }

      legend {
        font-weight: 600;
        margin-bottom: 6px;
      }

      .filters {
        display: inline-flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
      }

      .count {
        font-weight: 600;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
      }

      li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px 8px;
        border-top: 1px solid var(--border);
      }

      li:first-child { border-top: 0; }

      .task-title {
        display: inline-block;
      }

      .task-title.done {
        text-decoration: line-through;
        color: var(--muted);
      }

      .empty {
        margin-top: 16px;
        padding: 12px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        background: #fff;
        color: var(--muted);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To-do list</h1>
        <p class="subhead">Add tasks, mark them done, filter, and keep track of what’s left.</p>
      </header>

      <main class="panel" aria-labelledby="app-title">
        <h2 id="app-title" class="sr-only">Task manager</h2>

        <form id="add-form" novalidate>
          <div class="row">
            <div>
              <label for="task-title">New task</label>
              <input id="task-title" name="title" type="text" autocomplete="off" />
            </div>
            <div>
              <button id="add-btn" class="primary" type="submit">Add</button>
            </div>
          </div>
          <p id="title-help" class="help">Tip: press Enter to add.</p>
          <p id="title-error" class="error" role="alert" hidden></p>
        </form>

        <div class="toolbar" aria-live="polite">
          <fieldset aria-label="Filter tasks">
            <legend class="sr-only">Filters</legend>
            <div class="filters">
              <label class="filter"><input type="radio" name="filter" value="all" checked /> All</label>
              <label class="filter"><input type="radio" name="filter" value="todo" /> To do</label>
              <label class="filter"><input type="radio" name="filter" value="done" /> Done</label>
            </div>
          </fieldset>

          <div class="count" id="remaining" aria-label="Unfinished tasks count"></div>
        </div>

        <section aria-label="Tasks">
          <ul id="task-list"></ul>
          <div id="empty" class="empty" hidden></div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
