<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event RSVP</title>
    <style>
      :root {
        --bg: #0b1020;
        --surface: #121a33;
        --text: #f2f5ff;
        --muted: #c6cbe0;
        --border: #2a3563;
        --danger: #ff5c7a;
        --focus: #9cd3ff;
        --primary: #7aa2ff;
        --primaryText: #0b1020;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1000px 500px at 20% 0%, #18224a 0%, var(--bg) 55%);
        color: var(--text);
        line-height: 1.4;
      }

      a { color: inherit; }

      .wrap {
        max-width: 720px;
        padding: 32px 16px;
        margin: 0 auto;
      }

      header h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }

      header p {
        margin: 0;
        color: var(--muted);
      }

      main {
        margin-top: 24px;
        background: color-mix(in srgb, var(--surface) 92%, #000 8%);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label, legend {
        font-weight: 650;
      }

      input[type="text"],
      input[type="email"],
      input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0b1228;
        color: var(--text);
      }

      fieldset {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }

      .radios {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }

      .radioLine {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .error {
        margin: 0;
        color: var(--danger);
        font-weight: 600;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
      }

      button {
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
      }

      button.primary {
        background: var(--primary);
        color: var(--primaryText);
        border-color: color-mix(in srgb, var(--primary) 60%, #000 40%);
      }

      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      input[aria-invalid="true"],
      fieldset[aria-invalid="true"] {
        border-color: color-mix(in srgb, var(--danger) 70%, var(--border));
      }

      .confirmation {
        display: grid;
        gap: 12px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        background: #0b1228;
      }

      dl {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 8px 12px;
        margin: 0;
      }

      dt { color: var(--muted); }
      dd { margin: 0; font-weight: 650; }

      @media (max-width: 520px) {
        dl { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>RSVP</h1>
        <p>Please confirm your details for the event.</p>
      </header>

      <main id="app" aria-live="polite"></main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
